

; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; Official espressif32 platform = Arduino core 2.0.x.  Pinned below 7 because
; TFT_eSPI 2.5.x is not yet reliable on Arduino core 3.x.
platform = espressif32 @ ^6.4.0
board = esp32doit-devkit-v1   ; DOIT ESP32 DevKit V1, ESP32-WROOM-32 (USB-C variant)
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI is configured here instead of by editing its User_Setup.h, so the
; config lives in this repo and survives library updates.
;
; TFT_CS is deliberately NOT defined: two GC9A01 displays share SCLK/MOSI/DC/RST
; and the sketch drives each display's CS itself (DISPLAY_CS_PRESSURE /
; DISPLAY_CS_FLOW in main.cpp).  No MISO -- the displays are write-only.
;
; Pins avoid everything the meter already uses (GPIO 4 flow, 34 pressure, 2 LED),
; which is why they differ from the two-display article's wiring.
build_flags =
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_SCLK=18
    -D TFT_MOSI=23
    -D TFT_DC=16
    -D TFT_RST=17
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1   ; silences "TOUCH_CS not defined" -- these displays have no touch

; Same firmware with simulated sensors, for bench testing with just the ESP32
; and the displays.  Publishes to ranch/water-demo/* and never touches the
; saved flow total.  Upload with:  pio run -e demo -t upload
[env:demo]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -D DEMO_MODE=1
